 const i=S.month,rows=D.boards.map(([code,name])=>{const ks=filt(code),c=agg(ks,i),ly=i>=12?agg(ks,i-12):null,y=aggYear(ks,2019);let met=0,tot=0;for(let k=iOf('202101');k<=i;k++){const p=agg(ks,k).p;if(p!=null){tot++;if(p>=.95)met++;}}return {code,name,c,ly,y,met,tot};}).filter(r=>r.c.p!=null).sort((a,b)=>a.c.p-b.c.p);
 const sc=agg(filt('all'),i),scl=i>=12?agg(filt('all'),i-12):null;
 return `<div class="v s12"><h2>How each health board is performing, ${fm(i)}</h2><div class="sub">Sorted from furthest to closest to the target. Red line on each bar: the 95% target. Click a row to filter the report to that board.</div>${info('Change since last year compares the same month a year earlier. The 12-hour rate uses sites that record detailed waiting times.')}
 <div class="tw"><table><thead><tr><th>Health board</th><th class="n">Seen within 4 hours</th><th style="min-width:180px"></th><th class="n">Change since last year</th><th class="n">2019</th><th class="n">Waited 12+ hours</th><th class="n">Patients</th><th class="n">Months target met since 2021</th></tr></thead><tbody>
 ${rows.map(r=>`<tr data-click="board:${r.code}" ${r.code===S.board?'style="background:var(--banner)"':''}><td>${esc(r.name)}</td><td class="n"><b>${pct(r.c.p)}</b></td><td><div class="bar"><span style="width:${(r.c.p*100).toFixed(1)}%;background:${r.code===S.board?'var(--hi)':'var(--blue)'}"></span><i class="t" style="left:95%"></i></div></td><td class="n">${delta(r.c.p,r.ly&&r.ly.p)}</td><td class="n">${pct(r.y&&r.y.p)}</td><td class="n">${pct(r.c.r12)}</td><td class="n">${num(r.c.att)}</td><td class="n">${r.met} of ${r.tot}</td></tr>`).join('')}
 <tr style="font-weight:600"><td>Scotland</td><td class="n">${pct(sc.p)}</td><td><div class="bar"><span style="width:${(sc.p*100).toFixed(1)}%;background:var(--ctx)"></span><i class="t" style="left:95%"></i></div></td><td class="n">${delta(sc.p,scl&&scl.p)}</td><td class="n">${pct((aggYear(filt('all'),2019)||{}).p)}</td><td class="n">${pct(sc.r12)}</td><td class="n">${num(sc.att)}</td><td class="n"></td></tr>
 </tbody></table></div></div>
 <div class="foot">Change arrows: green means a higher share seen within 4 hours than a year earlier; red means lower.</div>`;}
function hospital(){
 const ks=filt(),i=S.month;const opts=ks.filter(k=>{const d=D.data[k];for(let j=Math.max(0,i-11);j<=i;j++)if(d[0][j]!=null)return true;return false;});
 if(S.hosp==null||!opts.includes(S.hosp)){S.hosp=opts.sort((a,b)=>(agg([a],i).p??2)-(agg([b],i).p??2))[0]??null;}
 if(S.hosp==null)return '<div class="v s12"><p class="note">No hospitals match these filters.</p></div>';
 const k=S.hosp,s=D.sites[k],c=agg([k],i),ly=i>=12?agg([k],i-12):null,r=agg([k],Math.max(0,i-11),i);
 const nat=D.sites.map((x,j)=>j).filter(j=>D.sites[j][3]===s[3]),t0=iOf('202101');
 const hp=ser([k],'p',t0,i),np=ser(nat,'p',t0,i),hr=ser([k],'r12',t0,i),nr=ser(nat,'r12',t0,i);
 const better=hp.filter((v,j)=>v!=null&&np[j]!=null&&v>=np[j]).length,valid=hp.filter((v,j)=>v!=null&&np[j]!=null).length;
 return `<div class="banner"><div class="k">${esc(BN[s[2]]||s[2])} | ${s[3]===1?'Emergency department':'Minor injury unit'}</div><p><b>${esc(s[1])}</b> saw <b>${pct(c.p)}</b> of patients within 4 hours in ${fm(i)}${c.p==null?'':`, ${c.p>=.95?'meeting':((.95-c.p)*100).toFixed(1)+' points short of'} the target`}. Since January 2021, it has matched or beaten the Scotland average in <b>${better} of ${valid}</b> months.</p></div>
 ${tile('Seen within 4 hours',pct(c.p),`${fm(i)} | ${delta(c.p,ly&&ly.p)} vs a year ago`)}
 ${tile('Last 12 months',pct(r.p),`${num(r.att)} patients`)}
 ${tile('Waited more than 12 hours',c.ep?pct(c.r12):'n/a',c.ep?`${num(c.o12)} patients in ${fm(i)}`:'Detailed waits not recorded')}
 ${tile('Detailed wait data coverage',pct(r.cov),'Share of patients, last 12 months')}
 <div class="v s7"><h2>Compared with the Scotland average</h2><div class="sub">Share seen within 4 hours, same department type</div>${info('Blue: this hospital. Grey: all hospitals of the same type in Scotland. Hover to read any month.')}
 <div class="leg"><span><i style="background:var(--blue)"></i>This hospital</span><span><i style="background:var(--ctx)"></i>Scotland average</span></div>
 ${line([{n:'This hospital',c:'var(--blue)',d:hp},{n:'Scotland average',c:'var(--ctx)',d:np,w:2}],{i0:t0,i1:i,yMin:Math.min(.3,Math.floor(Math.min(...hp.filter(v=>v!=null),.9)*10)/10)})}</div>
 <div class="v s5"><h2>Share waiting more than 12 hours</h2><div class="sub">A rate, so busier and quieter months compare fairly</div>
 <div class="leg"><span><i style="background:var(--blue)"></i>This hospital</span><span><i style="background:var(--ctx)"></i>Scotland average</span></div>
 ${hr.some(v=>v!=null)?line([{n:'This hospital',c:'var(--blue)',d:hr},{n:'Scotland average',c:'var(--ctx)',d:nr,w:2}],{i0:t0,i1:i,yMin:0,yMax:null,target:false,W:520,fmt:v=>(v*100).toFixed(0)+'%',tf:v=>(v*100).toFixed(1)+'%',step:.05}):'<p class="note">This site does not record detailed waiting times.</p>'}</div>`;}
function why(){
 const ks=filt(),i=S.month,t0=iOf('202101'),pts=[];for(let k=t0;k<=i;k++){const c=agg(ks,k);if(c.p!=null)pts.push([c.att,c.p,k]);}
 const n=pts.length,mx=pts.reduce((a,p)=>a+p[0],0)/n,my=pts.reduce((a,p)=>a+p[1],0)/n;let sxy=0,sxx=0,syy=0;pts.forEach(p=>{sxy+=(p[0]-mx)*(p[1]-my);sxx+=(p[0]-mx)**2;syy+=(p[1]-my)**2;});
 const rr=sxy/Math.sqrt(sxx*syy),sl=sxy/sxx,W=560,h=280,PL=46,PR=12,PT=12,PB=34;
 const x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0])),y0=Math.floor(Math.min(...pts.map(p=>p[1]))*20)/20,y1=Math.ceil(Math.max(...pts.map(p=>p[1]))*20)/20;
 const X=v=>PL+(v-x0)/(x1-x0||1)*(W-PL-PR),Y=v=>PT+(1-(v-y0)/(y1-y0||1))*(h-PT-PB);let g='';
 for(let t=y0;t<=y1+1e-9;t+=.05)g+=`<line x1="${PL}" x2="${W-PR}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${PL-6}" y="${Y(t)+3.5}" text-anchor="end">${Math.round(t*100)}%</text>`;
 const tk=Math.pow(10,Math.floor(Math.log10((x1-x0)/4)));const stp=Math.ceil((x1-x0)/4/tk)*tk;for(let t=Math.ceil(x0/stp)*stp;t<=x1;t+=stp)g+=`<text x="${X(t)}" y="${h-18}" text-anchor="middle">${num(t)}</text>`;
 g+=`<text x="${(W+PL)/2}" y="${h-2}" text-anchor="middle">Patients attending in the month</text>`;
 g+=`<line x1="${X(x0)}" y1="${Y(my+sl*(x0-mx))}" x2="${X(x1)}" y2="${Y(my+sl*(x1-mx))}" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3"/>`;
 pts.forEach(p=>{const rec=p[2]>i-12;g+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${rec?5:4}" fill="${rec?'var(--hi)':'var(--ctx)'}" fill-opacity="${rec?.95:.75}" data-tip="${esc(`<b>${fm(p[2])}</b>${num(p[0])} patients<br>${pct(p[1])} seen within 4 hours`)}"></circle>`;});
 const yrs=[];for(let y=2015;y<=+M[L].slice(0,4);y++)yrs.push(y);
 const cell=v=>{if(v==null)return '';const t=Math.max(0,Math.min(1,(v-.55)/.4));const l=Math.round(95-t*62);return `background:hsl(212 70% ${l}%);color:${l<60?'#fff':'#252423'}`;};
 let hm='<table style="table-layout:fixed"><thead><tr><th style="width:52px">Year</th>'+MN.map(m=>`<th class="n">${m}</th>`).join('')+'</tr></thead><tbody>';
 yrs.forEach(y=>{hm+=`<tr><td>${y}</td>`;for(let m=1;m<=12;m++){const k=iOf(y+String(m).padStart(2,'0'));const v=k<0||k>L?null:agg(ks,k).p;hm+=`<td class="n" style="${cell(v)};border:1px solid var(--page)" ${v!=null?`data-tip="${esc(`<b>${MN[m-1]} ${y}</b>${pct(v)} seen within 4 hours`)}"`:''}>${v==null?'':Math.round(v*100)}</td>`;}hm+='</tr>';});hm+='</tbody></table>';
 return `<div class="banner"><div class="k">Key insight</div><p>${rr<-.3?`Busier months <b>do</b> perform worse (correlation <b>${rr.toFixed(2)}</b>), but even the quietest months since 2021 stayed far below the 95% target. <b>Demand alone does not explain the decline</b>; pressures inside hospitals, such as bed availability and delayed discharges, are the likely next place to look.`:`Monthly demand has only a weak link with performance here (correlation <b>${rr.toFixed(2)}</b>). <b>The decline is not mainly about the number of patients arriving.</b>`}</p></div>
 <div class="v s5"><h2>Do busier months mean longer waits?</h2><div class="sub">Each dot is one month since January 2021. Dark blue: the latest 12 months.</div>${info('Further right means more patients that month; higher means more were seen within 4 hours. The dashed line shows the overall trend. Hover over a dot to see the month.')}
 <svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Scatter chart of attendances and performance">${g}</svg></div>
 <div class="v s7"><h2>Every month since 2015 at a glance</h2><div class="sub">Share seen within 4 hours. Darker blue is better; pale is worse.</div>${info('Each square is one month. Hover for the exact figure. A single-colour scale is used so it can be read by people with colour vision deficiency.')}<div class="tw">${hm}</div></div>`;}
function quality(){
 const i=S.month,all=D.sites.map((s,k)=>k);let noEp=0,rep=0;all.forEach(k=>{if(D.data[k][0][i]!=null){rep++;if(D.data[k][2][i]==null)noEp++;}});const cv=agg(all,Math.max(0,i-11),i).cov;
 return `${tile('Site-month records checked',num(D.rows),'All attendances, Jul 2007 to Jul 2026')}${tile('Implausible records',D.flags.length,'Excluded from every percentage')}${tile('Sites without detailed waits',`${noEp} of ${rep}`,`Reporting in ${fm(i)}`)}${tile('Detailed wait data coverage',pct(cv),'Share of patients, last 12 months')}
 <div class="v s12"><h2>Checks run on every load</h2><div class="sub">Every issue is flagged and documented, never silently changed.</div><div class="tw"><table><thead><tr><th>Check</th><th>Result</th><th>How it was handled</th></tr></thead><tbody>
 <tr><td>Each site and month appears for unplanned, planned and all attendances</td><td>Would triple-count if summed</td><td>Only the "all" category is used</td></tr>
 <tr><td>Duplicate records</td><td>Two rows for Queen Elizabeth University Hospital, May 2015 (the month it opened)</td><td>Combined into one</td></tr>
 <tr><td>Patients seen within 4 hours greater than attendances</td>${D.flags.map(f=>`<td>${esc(f[1])}, ${fm(iOf(f[0]))}: ${num(f[3])} within 4 hours out of ${num(f[2])} attendances</td>`).join('')}<td>Flagged and excluded from every percentage</td></tr>
 <tr><td>Sites missing from the current hospitals list</td><td>${D.missingNames} sites, mostly closed minor injury units</td><td>Labelled clearly rather than dropped</td></tr>
 <tr><td>Detailed (8 and 12-hour) waiting times</td><td>${noEp} sites do not record them in ${fm(i)}</td><td>Left blank, never treated as zero; 12-hour rates use only sites that record them</td></tr>
 <tr><td>Results match published figures</td><td>Scotland emergency departments, July 2026: 65.0%</td><td>Validated against the source</td></tr></tbody></table></div></div>`;}
const PAGES=[['Overview',overview],['Health boards',boards],['Hospital detail',hospital],['Why it is happening',why],['Data quality',quality]];
function pane(){const mo=[];for(let i=L;i>=Math.max(0,L-35);i--)mo.push(`<option value="${i}" ${i===S.month?'selected':''}>${fm(i)}</option>`);
 let h=`<h3>Department type</h3><select id="fType"><option value="1" ${S.type==='1'?'selected':''}>Emergency departments</option><option value="3" ${S.type==='3'?'selected':''}>Minor injury units</option><option value="all" ${S.type==='all'?'selected':''}>All A&amp;E sites</option></select>
 <h3>Health board</h3><select id="fBoard"><option value="all">All health boards</option>${D.boards.map(([c,n])=>`<option value="${c}" ${S.board===c?'selected':''}>${esc(n)}</option>`).join('')}</select>
 <h3>Month</h3><select id="fMonth">${mo.join('')}</select>`;
 if(S.page===2){const ks=filt().filter(k=>{const d=D.data[k];for(let j=Math.max(0,S.month-11);j<=S.month;j++)if(d[0][j]!=null)return true;return false;}).sort((a,b)=>D.sites[a][1].localeCompare(D.sites[b][1]));
  h+=`<h3>Hospital</h3><select id="fHosp">${ks.map(k=>`<option value="${k}" ${k===S.hosp?'selected':''}>${esc(D.sites[k][1])}</option>`).join('')}</select>`;}
 h+=`<h3>About</h3><div class="note">The NHS Scotland standard is that 95% of A&amp;E patients are admitted, transferred or discharged within 4 hours. Shares are calculated from total patients, never averaged.</div>`;$('pane').innerHTML=h;
 $('fType').onchange=e=>{S.type=e.target.value;S.hosp=null;draw();};$('fBoard').onchange=e=>{S.board=e.target.value;S.hosp=null;draw();};$('fMonth').onchange=e=>{S.month=+e.target.value;draw();};
 if($('fHosp'))$('fHosp').onchange=e=>{S.hosp=+e.target.value;draw();};}
const tip=$('tip');function showTip(html,e){tip.innerHTML=html;tip.style.display='block';const w=tip.offsetWidth,hh=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+hh>innerHeight-8)y=e.clientY-hh-14;tip.style.left=x+'px';tip.style.top=y+'px';}
const hideTip=()=>tip.style.display='none';
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(t.dataset.tip,e);else if(!(e.target.closest&&e.target.closest('svg[data-chart]')))hideTip();});
function draw(){CH.length=0;pane();$('tabs').innerHTML=PAGES.map((p,j)=>`<button class="${j===S.page?'on':''}" data-p="${j}" aria-current="${j===S.page?'page':'false'}">${p[0]}</button>`).join('');
 $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.page=+b.dataset.p;hideTip();draw();$('pg').parentElement.scrollTop=0;});
 $('pg').innerHTML=PAGES[S.page][1]();
 document.querySelectorAll('svg[data-chart]').forEach(sv=>{const c=CH[+sv.dataset.chart],gd=sv.querySelector('.guide'),dots=[...sv.querySelectorAll('.dot')];
  const mv=e=>{const r=sv.getBoundingClientRect(),sx=(e.clientX-r.left)*(c.W/r.width);let k=Math.round((sx-c.PL)/c.iw*c.n);k=Math.max(0,Math.min(c.n,k));const gx=c.PL+k/(c.n||1)*c.iw;gd.setAttribute('x1',gx);gd.setAttribute('x2',gx);gd.style.display='';
   let html=`<b>${fm(c.i0+k)}</b>`;c.series.forEach((s,j)=>{const v=s.d[k];if(v==null){dots[j].style.display='none';return;}dots[j].setAttribute('cx',gx);dots[j].setAttribute('cy',c.y(v));dots[j].style.display='';html+=`<span class="sw" style="background:${s.c}"></span>${esc(s.n)}: ${c.tf(v)}<br>`;});showTip(html,e);};
  sv.addEventListener('pointermove',mv);sv.addEventListener('pointerdown',mv);sv.addEventListener('pointerleave',()=>{gd.style.display='none';dots.forEach(d=>d.style.display='none');hideTip();});});
 document.querySelectorAll('[data-click]').forEach(el=>el.onclick=()=>{const [t,v]=el.dataset.click.split(':');if(t==='board'){S.board=S.board===v?'all':v;S.hosp=null;hideTip();draw();}});}
